<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Finance Manager Pro</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:white;}
.wrapper{max-width:900px;margin:auto;}
header{background:linear-gradient(145deg,#ffd700,#b8860b);color:#111;text-align:center;padding:18px;font-size:24px;font-weight:bold;}

.dashboard{display:grid;grid-template-columns: repeat(2, 1fr);gap:10px;padding:10px;}
.stat-box{background:#222;padding:15px;border-radius:10px;text-align:center;border:1px solid #444;}
.stat-box.red-border{border: 2px solid #e53935;}
.stat-box h2{margin:5px 0; font-size: 20px;}
.stat-box small{color: #aaa; font-size: 11px; text-transform: uppercase;}

.search-container{padding:10px;}
.search-input{width:100%; padding:12px; border-radius:8px; border:1px solid #ffd700; background:#222; color:white; box-sizing: border-box; outline: none;}

.top-buttons{text-align:center;margin:10px;}
button{padding:10px 15px;border:none;border-radius:8px;margin:4px;cursor:pointer;font-weight:bold;}
.gold{background:#ffd700;color:#111;}

.user-card{width:calc(100% - 30px);margin:10px auto;padding:15px;border-radius:12px;background:#222;cursor:pointer;position:relative; border: 1px solid #333;}
.user-card.redbg{background:#8b0000; border-color: #ff4444;}
.row{display:flex;justify-content:space-between; align-items:center;}

.popup-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:1000;justify-content:center;align-items:center;}
.popup-content{background:#222;padding:25px;border-radius:15px;text-align:center;border:2px solid #ffd700;min-width:250px;}

input[type="date"], input[type="text"], input[type="number"]{width:calc(100% - 20px);margin:5px 10px;padding:12px;border:none;border-radius:8px;background:#333;color:white; box-sizing: border-box;}
.hidden{display:none;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{padding:10px;text-align:center; border-bottom: 1px solid #333;}
th{background:#444; font-size: 12px; color: #ffd700;}
.credit-row{background:#1f7a1f;}
.debit-row{background:#8b1e1e;}
.pending-row{background:#2c2c2c; color:#ffd700;}
</style>
</head>
<body>

<div class="wrapper">
<header>Finance Manager Pro</header>

<div id="mainScreen">
    <div class="search-container">
        <input type="text" id="userSearch" class="search-input" placeholder="பெயர் அல்லது மொபைல் மூலம் தேடவும்..." oninput="renderUsers()">
    </div>

    <div class="dashboard">
        <div class="stat-box"><small>Total Users</small><h2 id="totalUsers">0</h2></div>
        <div class="stat-box"><small>Total Balance</small><h2 id="totalBalance">0</h2></div>
        <div class="stat-box red-border"><small style="color:#e53935;">Red Users</small><h2 id="redUsersCount" style="color:#e53935;">0</h2></div>
        <div class="stat-box red-border"><small style="color:#e53935;">10% Collection</small><h2 id="tenPercentTotal" style="color:#e53935;">0</h2></div>
    </div>

    <div class="top-buttons">
        <button class="gold" onclick="addUser()">+ Add User</button>
        <button class="gold" onclick="exportData()">Export</button>
        <button class="gold" onclick="document.getElementById('importFile').click()">Import</button>
        <input type="file" id="importFile" hidden onchange="importData(event)">
    </div>
    
    <div id="userList"></div>
</div>

<div id="userScreen" class="hidden">
    <button class="gold" onclick="goBack()" style="margin:10px;">← Back</button>
    <h3 id="userTitle" style="padding:10px; margin:0; border-bottom:1px solid gold;"></h3>
    <div style="padding:10px; background:#222;">
        <input type="date" id="tDate">
        <input type="text" id="tDesc" placeholder="விவரம்">
        <input type="number" id="tCredit" placeholder="வரவு (Credit)">
        <input type="number" id="tDebit" placeholder="செலவு (Debit)">
        <button class="gold" onclick="saveTransaction()" style="width:calc(100% - 20px); margin:10px; padding:15px;">Save Transaction ✅</button>
    </div>
    <div style="overflow-x:auto;">
        <table>
            <thead><tr><th>Date</th><th>Description</th><th>Credit</th><th>Debit</th><th>Balance</th></tr></thead>
            <tbody id="transactionTable"></tbody>
        </table>
    </div>
</div>
</div>

<div id="actionPopup" class="popup-overlay" onclick="closePopup()">
    <div class="popup-content" onclick="event.stopPropagation()">
        <h3 id="popupTitle" style="color:gold;">Action</h3>
        <button class="gold" id="editBtn" style="width:100%;">Edit</button><br>
        <button style="background:#e53935; color:white; width:100%; margin-top:10px;" id="deleteBtn">Delete</button><br>
        <button style="background:#555; color:white; width:100%; margin-top:10px;" onclick="closePopup()">Cancel</button>
    </div>
</div>

<script>
let users = JSON.parse(localStorage.getItem("financeUsers")) || [];
let currentUser = null;
let editIndex = null;

function saveLocal(){ localStorage.setItem("financeUsers", JSON.stringify(users)); }

function formatDate(d){ if(!d) return ""; let parts = d.split("-"); return `${parts[2]}-${parts[1]}-${parts[0]}`; }

function getBalance(user){
    if(!user.transactions) return 0;
    return user.transactions.reduce((a,t)=>a+(Number(t.credit||0)-Number(t.debit||0)), 0);
}

// RED USER: Credit/Debit இல்லாமல் இன்று அல்லது முந்தைய தேதி இருந்தால்
function isRed(user) {
    let today = new Date().toISOString().split("T")[0];
    return user.transactions.some(t => t.date <= today && !Number(t.credit) && !Number(t.debit));
}

// அசல் தொகையில் (முதல் Debit) 10% தவணை
function getTenPercent(user) {
    if(!isRed(user)) return 0;
    let loan = user.transactions.find(t => Number(t.debit) > 0);
    return loan ? (Number(loan.debit) * 0.10) : 0;
}

function renderUsers(){
    const search = document.getElementById("userSearch").value.toLowerCase();
    const userList = document.getElementById("userList");
    userList.innerHTML = "";

    let totalBal = 0, redCount = 0, tenPercentSum = 0;
    users.forEach(u => {
        totalBal += getBalance(u);
        if(isRed(u)) { redCount++; tenPercentSum += getTenPercent(u); }
    });

    document.getElementById("totalUsers").innerText = users.length;
    document.getElementById("totalBalance").innerText = "₹ " + totalBal.toLocaleString();
    document.getElementById("redUsersCount").innerText = redCount;
    document.getElementById("tenPercentTotal").innerText = "₹ " + tenPercentSum.toLocaleString();

    let filtered = users.filter(u => u.name.toLowerCase().includes(search) || (u.mobile && u.mobile.includes(search)));
    filtered.sort((a,b)=> isRed(b) - isRed(a));

    filtered.forEach((u)=>{
        let originalIdx = users.indexOf(u);
        let card=document.createElement("div");
        card.className="user-card" + (isRed(u) ? " redbg" : "");
        card.innerHTML=`<div class="row"><div><b>${u.name}</b><br><small>${u.mobile || ''}</small></div><div>₹ ${getBalance(u).toLocaleString()}</div></div>`;
        card.onclick=()=>openUser(originalIdx);
        addLongPress(card,(e)=>{ e.stopPropagation(); openActionPopup(u.name, () => editUser(originalIdx), () => deleteUser(originalIdx)); });
        userList.appendChild(card);
    });
}

function addUser(){
    let n=prompt("Name:"), m=prompt("Mobile:");
    if(n){ users.push({name:n,mobile:m,transactions:[]}); saveLocal(); renderUsers(); }
}

function editUser(i){
    users[i].name=prompt("Name:",users[i].name)||users[i].name;
    users[i].mobile=prompt("Mobile:",users[i].mobile)||users[i].mobile;
    saveLocal(); renderUsers();
}

function deleteUser(i){ if(confirm("Delete?")){ users.splice(i,1); saveLocal(); renderUsers(); } }

function openUser(i){
    currentUser=i;
    document.getElementById("mainScreen").classList.add("hidden");
    document.getElementById("userScreen").classList.remove("hidden");
    renderTransactions();
}

function goBack(){ document.getElementById("mainScreen").classList.remove("hidden"); document.getElementById("userScreen").classList.add("hidden"); renderUsers(); }

function saveTransaction(){
    let d = document.getElementById("tDate").value, desc = document.getElementById("tDesc").value;
    let c = document.getElementById("tCredit").value, deb = document.getElementById("tDebit").value;
    if(!d) return alert("தேதி அவசியம்!");
    let tx = { date: d, desc: desc, credit: c, debit: deb };
    if(editIndex === null) users[currentUser].transactions.push(tx);
    else { users[currentUser].transactions[editIndex] = tx; editIndex = null; }
    document.getElementById("tDate").value = ""; document.getElementById("tDesc").value = "";
    document.getElementById("tCredit").value = ""; document.getElementById("tDebit").value = "";
    saveLocal(); renderTransactions();
}

function renderTransactions(){
    let user = users[currentUser];
    user.transactions.sort((a, b) => new Date(a.date) - new Date(b.date));
    document.getElementById("userTitle").innerText = `${user.name} | Balance: ₹${getBalance(user)}`;
    const tableBody = document.getElementById("transactionTable");
    tableBody.innerHTML = "";
    
    let currentBal = 0;
    let displayList = [];
    user.transactions.forEach(tx => {
        let isDateOnly = (!Number(tx.credit) && !Number(tx.debit));
        if(!isDateOnly) currentBal += (Number(tx.credit || 0) - Number(tx.debit || 0));
        displayList.push({ ...tx, cumulative: isDateOnly ? "" : currentBal });
    });

    displayList.reverse().forEach((tx) => {
        let row = document.createElement("tr");
        if(Number(tx.credit) > 0) row.className = "credit-row";
        else if(Number(tx.debit) > 0) row.className = "debit-row";
        else row.className = "pending-row";

        row.innerHTML = `<td>${formatDate(tx.date)}</td>
                         <td>${tx.desc||""}</td>
                         <td>${tx.credit||""}</td>
                         <td>${tx.debit||""}</td>
                         <td><b>${tx.cumulative}</b></td>`; // தேதி மட்டும் இருந்தால் பேலன்ஸ் காட்டாது
        addLongPress(row, (e) => { 
            let idx = user.transactions.findIndex(t => t.date===tx.date && t.desc===tx.desc && t.credit===tx.credit);
            openActionPopup("Entry", () => editTransaction(idx), () => deleteTransaction(idx)); 
        });
        tableBody.appendChild(row);
    });
}

function editTransaction(i){
    let tx = users[currentUser].transactions[i];
    document.getElementById("tDate").value = tx.date;
    document.getElementById("tDesc").value = tx.desc;
    document.getElementById("tCredit").value = tx.credit;
    document.getElementById("tDebit").value = tx.debit;
    editIndex = i;
}

function deleteTransaction(i){ if(confirm("Delete?")){ users[currentUser].transactions.splice(i,1); saveLocal(); renderTransactions(); } }

function openActionPopup(title, onEdit, onDelete) {
    document.getElementById("popupTitle").innerText = title;
    document.getElementById("actionPopup").style.display = "flex";
    document.getElementById("editBtn").onclick = () => { onEdit(); closePopup(); };
    document.getElementById("deleteBtn").onclick = () => { onDelete(); closePopup(); };
}
function closePopup() { document.getElementById("actionPopup").style.display = "none"; }

function addLongPress(el, callback){
    let t;
    el.onmousedown = el.ontouchstart = () => { t = setTimeout(callback, 700); };
    el.onmouseup = el.onmouseleave = el.ontouchend = () => { clearTimeout(t); };
}

function exportData(){
    let a=document.createElement("a");
    a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(users));
    a.download="Finance_Pro_Backup.json"; a.click();
}

function importData(event){
    let f=event.target.files[0]; if(!f) return;
    let r=new FileReader();
    r.onload=function(e){ users=JSON.parse(e.target.result); saveLocal(); renderUsers(); };
    r.readAsText(f);
}

renderUsers();
</script>
</body>
</html>
